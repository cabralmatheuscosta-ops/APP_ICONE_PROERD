<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SIG - Sistema Integrado de Gestão</title>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1b2529"> 
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="SIG PROERD">
    <link rel="apple-touch-icon" href="proerd_icon_192x192.png">

    <style>
        /* Remove margens e barras de rolagem da casca externa */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1b2529; /* Cor oficial do seu tema */
            font-family: Arial, sans-serif;
        }

        /* O iframe do Apps Script ocupará 100% da tela de forma oculta até carregar */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: none;
        }

        /* Tela de carregamento centralizada e estilizada */
        #loader_SIG {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            color: #ffffff;
            font-size: 16px;
        }

        /* Indicador visual de carregamento (Spinner) */
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.1);
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border-left-color: #ffffff;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div id="loader_SIG">
        <div class="spinner"></div>
        <div id="statusTexto">Carregando o sistema...</div>
    </div>

    <iframe id="iframe_SIG" src=""></iframe>

    <script>
        function executarArquiteturaIntegrada_SIG() {
            // Sua URL oficial do Google Apps Script
            const urlBaseAppsScript = "https://script.google.com/macros/s/AKfycby2AOGYh4vfByC8X7lWrRD_Mp1-O1yMkqQB9Zk5YXAze0Z8VJ9VNcAOEoqxNs3DbUgJ/exec";
            
            // Captura de forma dinâmica qualquer parâmetro (ex: ?modo=instrutor) vindo do app/link
            const parametrosURL = window.location.search;
            
            // Une a URL base com os parâmetros capturados
            const urlFinalDeDestino = urlBaseAppsScript + parametrosURL;
            
            const iframe = document.getElementById('iframe_SIG');
            const loader = document.getElementById('loader_SIG');
            
            // Aplica a URL final ao iFrame
            iframe.src = urlFinalDeDestino;
            
            // Quando o Google Apps Script terminar de processar o HTML, faz a transição de tela
            iframe.onload = function() {
                loader.style.display = 'none';
                iframe.style.display = 'block';
            };
        }

        // Dispara o iFrame assim que a estrutura base estiver pronta
        document.addEventListener("DOMContentLoaded", executarArquiteturaIntegrada_SIG);
    </script>
</body>
</html>
